name: Patchly PR Review
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        required: false
        default: review

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: Llucs/patchly@main
        with:
          mode: review
          provider: api
